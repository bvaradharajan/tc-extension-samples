<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D viewer extension popover (Set 2)</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #212834;
        background: #fff;
        text-align: center;
      }

      p {
        margin: 0.25rem 0;
      }

      .muted {
        font-size: 0.875rem;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <p><strong>Popover opened by a 3D viewer extension (Set 2)</strong></p>
    <p class="muted">Registered through <code>extension.configure({ type: "popover" })</code>.</p>
    <p class="muted">Use <em>Close popover</em> in the extension to remove it.</p>
  </body>
</html>
